[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-plugin-vlc"
dynamic = ["version"]
description = "vlc plugin for ovos"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["ovos", "audio", "video", "OCP", "plugin"]
dependencies = [
    # floor kept resolvable against both the released v1 templates and the
    # unreleased media-backend-v2 template this plugin targets; bump to
    # ">=3.0.0a1,<4.0.0" once ovos-plugin-manager 3.0.0a1 releases (this PR
    # merges only after that release).
    "ovos-plugin-manager>=2.11.6a1,<4.0.0",
    "python-vlc>=1.1.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    # end-to-end harness: drives the real backend through a real OCPMediaPlayer.
    # [media] (the OCPPlayerHarness) lands in ovoscope 0.20.x; floor-pin so pip
    # resolves it without --pre once published.
    "ovoscope[media]>=0.20.0a1",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-plugin-vlc"

[project.entry-points."opm.media.audio"]
ovos-media-audio-plugin-vlc = "ovos_media_plugin_vlc:VLCOCPAudioService"

[project.entry-points."opm.media.video"]
ovos-media-video-plugin-vlc = "ovos_media_plugin_vlc:VLCOCPVideoService"

# legacy ovos-audio service backend (so the plugin works on both stacks)
[project.entry-points."mycroft.plugin.audioservice"]
ovos_vlc = "ovos_media_plugin_vlc.audio"

[tool.setuptools.dynamic]
version = { attr = "ovos_media_plugin_vlc.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_media_plugin_vlc*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.voc", "*.intent", "*.dialog"]
